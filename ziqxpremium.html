<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROZIQX PREMIUM | Master Ruler Edition</title>
    <style>
        :root {
            --ios-yellow: #FFD60A;
            --premium-glass: rgba(255, 255, 255, 0.25);
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--ios-yellow);
            font-family: var(--ios-font); touch-action: none;
        }

        /* Splash Screen */
        #splash {
            position: fixed; inset: 0; background: var(--ios-yellow);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; transition: 1s ease-in-out;
        }

        .splash-text {
            font-size: 3rem; font-weight: 800; font-style: italic;
            background: var(--premium-glass); backdrop-filter: blur(25px);
            padding: 30px 60px; border-radius: 60px; border: 1px solid rgba(255,255,255,0.4);
            animation: helloAnim 3s forwards;
        }

        @keyframes helloAnim {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(2deg); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; visibility: hidden; }
        }

        /* Drawing Area */
        canvas {
            display: block; background: #fff; margin: 2% auto;
            border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        /* Drawer / Dynamic Island */
        .dynamic-island {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 220px; height: 50px; background: #000;
            border-radius: 30px; color: white; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            z-index: 1500; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .dynamic-island.expanded {
            width: 92%; height: auto; padding: 20px 0; border-radius: 40px;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(40px);
        }

        .content { display: none; width: 100%; padding: 0 20px; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .dynamic-island.expanded .content { display: grid; }
        .dynamic-island.expanded .label { display: none; }

        .tool-btn {
            background: rgba(255,255,255,0.1); border-radius: 15px; padding: 12px;
            text-align: center; font-size: 10px; font-weight: bold; color: #fff; border: 1px solid transparent;
        }
        .tool-btn.active { background: var(--ios-yellow); color: #000; }

        .palette { grid-column: span 4; display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
        .color-dot { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }

        /* Ghost Shape Preview */
        #ghost-preview {
            position: absolute; border: 2px dashed #000; pointer-events: none; display: none; opacity: 0.4;
        }
    </style>
</head>
<body>

    <div id="splash"><div class="splash-text">ZIQXPREMIUM</div></div>

    <div class="dynamic-island" id="island" onclick="toggleMenu(event)">
        <span class="label">PROZIQX MENU</span>
        <div class="content">
            <div class="tool-btn active" id="brush" onclick="setTool('brush')">🖌️ BRUSH</div>
            <div class="tool-btn" id="eraser" onclick="setTool('eraser')">🧽 ERASER</div>
            <div class="tool-btn" id="square" onclick="setTool('square')">⬜ SQUARE</div>
            <div class="tool-btn" id="circle" onclick="setTool('circle')">⭕ CIRCLE</div>
            <div class="tool-btn" id="line" onclick="setTool('line')">📏 LINE</div>
            <div class="tool-btn" id="triangle" onclick="setTool('triangle')">📐 TRI</div>
            
            <div class="palette">
                <div class="color-dot" style="background:#000" onclick="setColor('#000')"></div>
                <div class="color-dot" style="background:#FF3B30" onclick="setColor('#FF3B30')"></div>
                <div class="color-dot" style="background:#007AFF" onclick="setColor('#007AFF')"></div>
                <div class="color-dot" style="background:#4CD964" onclick="setColor('#4CD964')"></div>
                <input type="color" id="favColor" onchange="setColor(this.value)" style="width:25px; height:25px; border:none; background:none;">
            </div>
            
            <div style="grid-column: span 4; display: flex; gap: 10px; align-items: center;">
                <input type="range" id="size" min="1" max="50" value="5" style="flex:1;">
                <button onclick="clearCanvas()" style="background:#fff; border:none; border-radius:10px; padding:5px 10px; font-weight:bold;">CLEAR</button>
            </div>
        </div>
    </div>

    <div id="ghost-preview"></div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const ghost = document.getElementById('ghost-preview');
        let painting = false, tool = 'brush', color = '#000', startX, startY;

        function resize() {
            canvas.width = window.innerWidth * 0.95;
            canvas.height = window.innerHeight * 0.85;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        }
        window.addEventListener('resize', resize); resize();

        function toggleMenu(e) {
            if(e.target.closest('.tool-btn') || e.target.closest('.palette') || e.target.closest('input')) return;
            document.getElementById('island').classList.toggle('expanded');
        }

        function setTool(t) {
            tool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(t).classList.add('active');
        }

        function setColor(c) { color = c; }
        function clearCanvas() { ctx.clearRect(0,0,canvas.width,canvas.height); }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            return {x, y};
        }

        canvas.onmousedown = canvas.ontouchstart = (e) => {
            painting = true;
            const pos = getPos(e);
            startX = pos.x; startY = pos.y;
            if(tool === 'brush' || tool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
            }
        };

        window.onmousemove = window.ontouchmove = (e) => {
            if(!painting) return;
            const pos = getPos(e);
            ctx.lineWidth = document.getElementById('size').value;
            ctx.strokeStyle = (tool === 'eraser') ? '#fff' : color;

            if(tool === 'brush' || tool === 'eraser') {
                ctx.lineTo(pos.x, pos.y); ctx.stroke();
            } else {
                // Ghost Preview logic
                ghost.style.display = 'block';
                const l = Math.min(startX, pos.x), t = Math.min(startY, pos.y);
                const w = Math.abs(pos.x - startX), h = Math.abs(pos.y - startY);
                ghost.style.left = (l + canvas.offsetLeft) + 'px';
                ghost.style.top = (t + canvas.offsetTop) + 'px';
                ghost.style.width = w + 'px'; ghost.style.height = h + 'px';
                ghost.style.borderRadius = (tool === 'circle') ? '50%' : '0';
            }
        };

        window.onmouseup = window.ontouchend = (e) => {
            if(!painting) return;
            const pos = getPos(e);
            ghost.style.display = 'none';
            
            ctx.lineWidth = document.getElementById('size').value;
            ctx.strokeStyle = (tool === 'eraser') ? '#fff' : color;

            // Final Draw based on tool
            if(tool === 'square') ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
            if(tool === 'circle') {
                const r = Math.sqrt(Math.pow(pos.x-startX,2)+Math.pow(pos.y-startY,2));
                ctx.beginPath(); ctx.arc(startX, startY, r, 0, Math.PI*2); ctx.stroke();
            }
            if(tool === 'line') {
                ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            }
            if(tool === 'triangle') {
                ctx.beginPath(); ctx.moveTo(startX + (pos.x - startX)/2, startY);
                ctx.lineTo(startX, pos.y); ctx.lineTo(pos.x, pos.y); ctx.closePath(); ctx.stroke();
            }
            
            painting = false; ctx.beginPath();
        };

        setTimeout(() => document.getElementById('splash').style.display='none', 3000);
    </script>
</body>
</html>
